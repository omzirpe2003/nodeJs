<!--
table => table
            tr=> table row (th=> table head , td=> Table data)
-->
            
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<title>Student Marks Table</title>
<body>
    <div>
        <h3>Student Marks Table</h3>
        <table border="1">
            <tr>
                <th>Name</th>
                <th>marks</th>
                <th>subject</th>
            </tr>
            <tr>
                <td>Om Zirpe</td>
                <td>99</td>
                <td>2nd Yaer</td>
            </tr>                
            <tr>
                <td>Shivam Zirpe</td>
                <td>100</td>
                <td>Final Year</td>
            </tr>
        </table>
    </div>    
</body>
</html>
